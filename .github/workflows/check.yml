name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.12.15'
          enable-cache: false
      - name: Validate repository
        env:
          BASE_REVISION: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: |
          # Pull requests use the first parent of the tested merge commit.
          if [ "$BASE_REVISION" = 0000000000000000000000000000000000000000 ]; then
            BASE_REVISION=$(git hash-object -t tree -w --stdin </dev/null)
          elif ! git cat-file -e "$BASE_REVISION^{commit}"; then
            git fetch --no-tags origin "$BASE_REVISION"
          fi
          sh eval/check.sh "$BASE_REVISION"
