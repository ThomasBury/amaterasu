[project]
name = "amaterasu-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyyaml>=6.0.3",
    "skills-ref",
]

[tool.uv]
package = false

[tool.uv.sources]
skills-ref = { git = "https://github.com/agentskills/agentskills.git", rev = "69ef37e9424c0a7ea9dd2293b559e43ec8176379", subdirectory = "skills-ref" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
